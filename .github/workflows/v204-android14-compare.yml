name: V204 My Lotteries Android 14 comparison
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - .github/workflows/v204-android14-compare.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the official My Lotteries APK
        id: apk
        run: python diagnostica_v194_apk_check.py
      - name: Enable KVM virtualization
        if: steps.apk.outputs.can_emulate == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Repeat same ordinary UI gestures on Android 14
        if: steps.apk.outputs.can_emulate == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python diagnostica_v203_edge_scroll.py
      - name: Save version comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V204-android14-ui
          path: v203_risultati/
          retention-days: 3
