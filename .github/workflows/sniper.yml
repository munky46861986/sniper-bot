name: 10eLotto Enigma 24x7

on:
  workflow_dispatch:
  schedule:
    # Watchdog: se una run e' stata stoppata/cancellata, riprova ogni ora.
    # Il minuto 17 evita il picco tipico dell'inizio dell'ora.
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

# Una sola istanza del bot alla volta. Se arriva un nuovo trigger mentre il bot gira,
# resta al massimo una run pending; non viene mai cancellata la run attiva.
concurrency:
  group: 10elotto-enigma-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "python-telegram-bot>=20,<22" requests beautifulsoup4
          fi

      - name: Run 10eLotto bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TZ: Europe/Rome
          PERSIST_GIT_STATE: "1"
          GIT_COMMIT_MIN_SECONDS: "300"
          BOT_MAX_RUNTIME_SECONDS: "19800"
          BOT_ROTATION_NOTIFY: "1"
        run: python sniper.py

      - name: Start next runner after clean rotation
        # sniper.py termina con codice 0 dopo la rotazione programmata a 5h30.
        # Se il job viene cancellato o Python va in errore, interviene il watchdog schedule.
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW_FILE="$(basename "${WORKFLOW_REF%@*}")"
          echo "Dispatch next run: ${WORKFLOW_FILE} on ${GITHUB_REF_NAME}"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
