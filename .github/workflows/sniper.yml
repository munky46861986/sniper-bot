name: Sniper Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper-bot-live
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      PYTHONUNBUFFERED: "1"
      PERSIST_GIT_STATE: "1"
      GIT_COMMIT_MIN_SECONDS: "300"
      STATE_GIT_BRANCH: "main"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-telegram-bot==22.8

      - name: Run bot
        run: python -u sniper.py
