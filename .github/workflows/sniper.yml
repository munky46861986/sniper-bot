name: 10eLotto ENGINE Only

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: 10elotto-engine-only-live
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      PYTHONUNBUFFERED: "1"
      PERSIST_GIT_STATE: "1"
      GIT_COMMIT_MIN_SECONDS: "300"
      STATE_GIT_BRANCH: "main"
      LOOP_SEC: "60"
      BOT_MAX_RUNTIME_SECONDS: "19800"
      BOT_ROTATION_NOTIFY: "1"
      ENGINE_NOTIFY_SIGNALS: "1"
      ENGINE_NOTIFY_H1_RESULT: "1"
      ENGINE_NOTIFY_H5_RESULT: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-telegram-bot==22.8

      - name: Run ENGINE Only bot
        run: python -u sniper.py

      - name: Start next bot run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Avvio automatico del prossimo runner ENGINE Only..."
          sleep 10
          for attempt in 1 2 3; do
            if gh workflow run sniper.yml --ref "${GITHUB_REF_NAME}"; then
              echo "Nuovo workflow_dispatch accettato."
              exit 0
            fi
            echo "Tentativo ${attempt}/3 fallito; riprovo tra 15 secondi..."
            sleep 15
          done
          echo "ERRORE: impossibile avviare il prossimo run."
          exit 1
