name: V175 APK statico e controllo Eurobet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v175:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnostica senza installare browser
        run: python diagnostica_v175.py
      - name: Conserva risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V175-risultati
          path: risultati_v175/
          if-no-files-found: warn
          retention-days: 7
