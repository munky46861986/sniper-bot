name: V197 My Lotteries privacy diagnostics
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - diagnostica_v197_cmp.py
      - .github/workflows/v197-privacy-cmp.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify APK and emulator compatibility
        id: apk
        run: python diagnostica_v194_apk_check.py
      - name: Enable hardware acceleration
        if: steps.apk.outputs.can_emulate == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect privacy dialog and logcat
        if: steps.apk.outputs.can_emulate == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python diagnostica_v197_cmp.py
      - name: Store privacy diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V197-privacy-diagnostic
          path: v197_risultati/
          retention-days: 2
