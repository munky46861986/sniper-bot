name: TWIN90 - osservazione LIVE ogni 5 minuti

on:
  workflow_dispatch:
  push:
    paths:
      - 'TWIN90/twin90_live.py'
      - 'TWIN90/test_twin90_live.py'
      - 'TWIN90/twin90_telegram.py'
      - 'TWIN90/test_twin90_telegram.py'
      - '.github/workflows/twin90_live.yml'
  schedule:
    # Each 5 minutes, offset 2 minutes after the scheduled draw.
    # GitHub scheduled execution is best effort and may be delayed.
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: twin90-live
  cancel-in-progress: false

jobs:
  observe:
    name: TWIN90 - feed reale, confronto, salvataggio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: TWIN90
    steps:
      - name: Checkout codice main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout ramo dati separato
        uses: actions/checkout@v4
        with:
          ref: twin90-live-state
          path: _twin90_state

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa librerie
        run: python -m pip install -r TWIN90/requirements.txt requests beautifulsoup4

      - name: Undici test automatici
        run: |
          python -m unittest discover -s TWIN90 -p 'test_twin90_live.py' -v
          python -m unittest discover -s TWIN90 -p 'test_twin90_telegram.py' -v

      - name: Leggi estrazioni REALI e confronta solo i concorsi nuovi
        shell: bash
        run: |
          set -euo pipefail
          python TWIN90/twin90_live.py \
            --model TWIN90/twin90_model_2025_2026.json \
            --state _twin90_state/twin90_live_state.json \
            --output TWIN90/output_live/last_run.json
          python - <<'PY'
          import json, os
          v=json.load(open('TWIN90/output_live/last_run.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## TWIN90 LIVE - nessuna giocata\n\n')
              f.write('Stato: **'+v['status']+'** | ultimo concorso: **'+v['latest']+'**\n\n')
              f.write('Nuove estrazioni: **'+str(v['new_draws'])+'** | confronti totali: **'+str(v['evaluated'])+'**\n\n')
              for name, r in v.get('models',{}).items():
                  f.write('- '+name+': '+str(r['draws'])+' test; Base medi in comune: '+str(r['avg_base_overlap'])+'/20\n')
              if v.get('source_warnings'):
                  f.write('\nFonte parziale, controllare il log.\n')
          PY

      - name: Invia nuove estrazioni reali su Telegram Superambo3
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python TWIN90/twin90_telegram.py --state _twin90_state/twin90_live_state.json

      - name: Salva dati SOLO sul branch twin90-live-state
        shell: bash
        run: |
          set -euo pipefail
          cd _twin90_state
          git add twin90_live_state.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato."
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'state: TWIN90 read-only live observations'
            git push origin HEAD:twin90-live-state
          fi

      - name: Esporta report del controllo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin90-live-${{ github.run_id }}
          path: TWIN90/output_live/
          if-no-files-found: ignore
          retention-days: 14
