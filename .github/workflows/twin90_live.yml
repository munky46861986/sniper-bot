name: TWIN90 - osservazione LIVE ogni 5 minuti

on:
  workflow_dispatch:
  push:
    paths:
      - 'TWIN90/twin90_live.py'
      - 'TWIN90/twin90_advance.py'
      - 'TWIN90/twin90_runner.py'
      - 'TWIN90/twin90_telegram.py'
      - 'TWIN90/test_twin90_live.py'
      - 'TWIN90/test_twin90_telegram.py'
      - '.github/workflows/twin90_live.yml'
  schedule:
    # Recovery watchdog. Regular 5-min cadence is maintained by the running
    # supervisor itself, NOT by unreliable GitHub scheduled triggers.
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: twin90-live-supervisor
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  observe:
    name: TWIN90 - LIVE supervision ogni 5 minuti
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONPATH: TWIN90
    steps:
      - name: Checkout codice main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Checkout ramo dati separato
        uses: actions/checkout@v4
        with:
          ref: twin90-live-state
          path: _twin90_state
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa librerie
        run: python -m pip install -r TWIN90/requirements.txt requests beautifulsoup4

      - name: Test di integrita, sicurezza temporale e Telegram
        run: |
          python -m unittest discover -s TWIN90 -p 'test_twin90_live.py' -v
          python -m unittest discover -s TWIN90 -p 'test_twin90_telegram.py' -v

      - name: Segui le estrazioni reali e invia Telegram ogni 5 minuti
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWIN90_RUNTIME_SECONDS: "19500"
        run: python TWIN90/twin90_runner.py --interval 300

      - name: Avvia automaticamente il runner successivo
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/twin90_live.yml/dispatches" \
            -f ref="main"
          echo "TWIN90: nuova istanza LIVE richiesta."

      - name: Rapporto di diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin90-live-${{ github.run_id }}
          path: TWIN90/output_live/
          if-no-files-found: ignore
          retention-days: 14
