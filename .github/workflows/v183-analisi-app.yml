name: V183 Analisi statica app My Lotteries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analisi-statica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analisi APK ufficiale (solo lettura)
        run: python diagnostica_v183.py
      - name: Conserva risultati anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V183-risultati-app
          path: v183_risultati/
          if-no-files-found: warn
