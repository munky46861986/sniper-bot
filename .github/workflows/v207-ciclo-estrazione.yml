name: V207 Osservazione ciclo estrazione Android
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - diagnostica_v207_ciclo.py
      - .github/workflows/v207-ciclo-estrazione.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica e verifica APK pubblico
        id: apk
        run: python diagnostica_v194_apk_check.py
      - name: Abilita accelerazione KVM
        if: steps.apk.outputs.can_emulate == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Osserva un ciclo completo senza giocare
        if: steps.apk.outputs.can_emulate == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python diagnostica_v207_ciclo.py
      - name: Salva evidenze V207
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V207-ciclo-estrazione
          path: v207_risultati/
          retention-days: 3
