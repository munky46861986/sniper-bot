name: V205 Android14 after notification prompt
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - diagnostica_v205_android14_ui.py
      - .github/workflows/v205-android14-notification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public My Lotteries APK
        id: apk
        run: python diagnostica_v194_apk_check.py
      - name: Enable KVM
        if: steps.apk.outputs.can_emulate == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Decline optional Android notifications and inspect home
        if: steps.apk.outputs.can_emulate == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python diagnostica_v205_android14_ui.py
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V205-android14-after-notifications
          path: v205_risultati/
          retention-days: 3
