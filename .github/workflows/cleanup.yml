name: Cleanup 10eLotto old runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed sniper.yml runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sniper.yml',
                status: 'completed',
                per_page: 100
              }
            );

            core.info(`Run completate trovate: ${runs.length}`);

            let deleted = 0;
            for (const run of runs) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              deleted++;
            }

            core.info(`Run eliminate: ${deleted}`);
