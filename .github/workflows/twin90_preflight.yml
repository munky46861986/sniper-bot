name: TWIN90 - test simulazioni preventive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/twin90_preflight.yml'
      - 'TWIN90/twin90_advance.py'
      - 'TWIN90/twin90_live.py'
      - 'TWIN90/twin90_telegram.py'
      - 'TWIN90/test_twin90_live.py'
      - 'TWIN90/test_twin90_telegram.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: TWIN90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install -r TWIN90/requirements.txt requests beautifulsoup4
      - name: Compila codice e verifica le simulazioni preventive
        run: |
          python -m py_compile TWIN90/twin90_advance.py TWIN90/twin90_live.py TWIN90/twin90_telegram.py
          python -m unittest discover -s TWIN90 -p 'test_twin90_live.py' -v
          python -m unittest discover -s TWIN90 -p 'test_twin90_telegram.py' -v
