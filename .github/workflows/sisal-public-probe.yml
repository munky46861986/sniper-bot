name: Sisal public page access probe (diagnostic)
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - diagnostica_sisal_public_probe.py
      - .github/workflows/sisal-public-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install normal browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m py_compile diagnostica_sisal_public_probe.py
      - name: Check public Sisal page
        run: python diagnostica_sisal_public_probe.py
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sisal-public-probe
          path: sisal_probe_output/
          retention-days: 3
