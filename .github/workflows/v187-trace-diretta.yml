name: V187 Trace navigazione diretta My Lotteries
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - diagnostica_v187.py
      - .github/workflows/v187-trace-diretta.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace statico V187
        run: python diagnostica_v187.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V187-risultati
          path: v187_risultati/
