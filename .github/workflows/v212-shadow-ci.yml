name: V212 shadow checks
on:
  pull_request:
    paths:
      - 'sniper.py'
      - 'v212_shadow.py'
      - 'test_v212_shadow.py'
      - '.github/workflows/v212-shadow-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python code
        run: python -m py_compile sniper.py v212_shadow.py test_v212_shadow.py
      - name: Test V212 without external packages
        run: python test_v212_shadow.py
