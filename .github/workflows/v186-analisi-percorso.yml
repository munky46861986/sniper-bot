name: V186 Analisi percorso diretta My Lotteries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Esegui diagnostica
        run: python diagnostica_v186.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V186-risultati
          path: v186_risultati/
