name: V173 Analisi Pubblica Risorse 10eLotto
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostica-v173:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa Playwright (solo modulo Python)
        run: python -m pip install 'playwright>=1.50,<2'
      - name: Verifica Chrome di sistema
        run: |
          command -v google-chrome || command -v chromium || (echo 'Browser assente' && exit 1)
      - name: Esegui V173
        run: python diagnostica_v173.py --output risultati_v173 --observe-seconds 8
      - name: Carica diagnostica anche se il test fallisce
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V173-risultati
          path: risultati_v173/
          if-no-files-found: warn
          retention-days: 7
