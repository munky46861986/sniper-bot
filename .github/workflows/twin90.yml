name: TWIN90 - laboratorio 10eLotto

on:
  workflow_dispatch:
  push:
    paths:
      - 'TWIN90/**'
      - '.github/workflows/twin90.yml'

permissions:
  contents: read

concurrency:
  group: twin90-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    name: TWIN90 - test e 288 concorsi sintetici
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: TWIN90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: python -m pip install -r TWIN90/requirements.txt

      - name: Cinque test di integrita
        run: python -m unittest discover -s TWIN90 -p 'test_twin90.py' -v

      - name: Genera due giornate sintetiche, non previsioni
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TWIN90/output
          TODAY="$(TZ=Europe/Rome date +%F)"
          python TWIN90/lotto_twin90.py simulate \
            --model TWIN90/twin90_model_2025_2026.json \
            --mode UNIFORM --count 288 --start "$TODAY" \
            --seed "${GITHUB_RUN_ID}" --output TWIN90/output/uniform_288.csv
          python TWIN90/lotto_twin90.py simulate \
            --model TWIN90/twin90_model_2025_2026.json \
            --mode HYBRID --count 288 --start "$TODAY" \
            --seed "$((GITHUB_RUN_ID + 1))" --output TWIN90/output/hybrid_288.csv
          python TWIN90/check_outputs.py TWIN90/output/uniform_288.csv TWIN90/output/hybrid_288.csv

      - name: Pubblica la sintesi
        shell: bash
        run: |
          echo "## TWIN90 — simulazioni sintetiche completate" >> "$GITHUB_STEP_SUMMARY"
          echo "288 estrazioni UNIFORM + 288 HYBRID. Nessun acquisto, nessuna giocata, nessuna previsione certa." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Scarica l\x27artifact **twin90-simulazioni** per i CSV e il rapporto di controllo.' >> "$GITHUB_STEP_SUMMARY"
          cat TWIN90/output/controlli.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Scarica CSV e controllo
        uses: actions/upload-artifact@v4
        with:
          name: twin90-simulazioni
          path: TWIN90/output/
          retention-days: 30
