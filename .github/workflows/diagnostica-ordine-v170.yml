name: Diagnosi V170 Ordine Estrazioni (NON MODIFICA BOT)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser disponibile
        shell: bash
        run: |
          command -v google-chrome || true
          google-chrome --version || true
          command -v microsoft-edge || true
      - name: Installa soltanto Playwright (usa Chrome gia installato)
        run: python -m pip install 'playwright>=1.50,<2'
      - name: Diagnosi lettura estrazioni
        run: python test_ordine_browser_v170.py --minuti 3 --output risultati_v170
      - name: Salva risultati diagnostici
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V170-risultati-browser-ordine
          path: risultati_v170/
          if-no-files-found: warn
          retention-days: 7
