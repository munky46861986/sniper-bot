name: V211 Android app link estrazioni
on:
  push:
    branches:
      - diagnostica/v186-app-route
    paths:
      - diagnostica_v211_android_link.py
      - .github/workflows/v211-android-link.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate V211 Python syntax
        run: python -m py_compile diagnostica_v211_android_link.py
      - name: Download and verify official APK
        id: apk
        run: python diagnostica_v194_apk_check.py
      - name: Enable Android emulator
        if: steps.apk.outputs.can_emulate == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open one legitimate registered app link
        if: steps.apk.outputs.can_emulate == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python diagnostica_v211_android_link.py
      - name: Save app link screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V211-android-link
          path: v211_risultati/
          retention-days: 3
